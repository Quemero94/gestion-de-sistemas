<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Sistemas - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="login-view" class="card">
      <h1>Gestión de Sistemas</h1>
      <p class="subtitle">Ingresá con tu usuario</p>

      <form id="login-form" novalidate>
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <p id="error" role="alert" class="error" hidden></p>

        <button type="submit">Iniciar sesión</button>
      </form>
    </section>

    <section id="home-view" class="card" hidden>
      <h1 id="bienvenida"></h1>
      <p>Ingresaste correctamente al sistema.</p>
      <button id="logout" type="button">Cerrar sesión</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
